name: Bina APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bina APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Namakan APK
        run: cp app/build/outputs/apk/release/app-release.apk LauncherKereta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LauncherKereta
          path: LauncherKereta.apk

      - name: Terbitkan untuk muat turun
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Launcher Kereta 1.0.${{ github.run_number }}
          make_latest: true
          files: LauncherKereta.apk
